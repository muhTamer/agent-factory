name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Black)
        run: black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (unit only, integration tests excluded)
        run: python -m pytest -q

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    env:
      HAS_LLM_KEY: ${{ secrets.OPENAI_API_KEY != '' || secrets.AZURE_OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: env.HAS_LLM_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        if: env.HAS_LLM_KEY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Integration tests (requires LLM credentials)
        if: env.HAS_LLM_KEY == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: python -m pytest -m integration -o "addopts=" -q
      - name: Skip notice
        if: env.HAS_LLM_KEY != 'true'
        run: echo "⚠️ Integration tests skipped — no LLM credentials configured. Add OPENAI_API_KEY (or Azure equivalents) to repository secrets."
