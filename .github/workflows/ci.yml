name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        id: deps
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff check
        id: ruff
        continue-on-error: true
        run: ruff check .
      - name: Black check
        id: black
        continue-on-error: true
        run: black --check .
      - name: Post debug info
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### CI Lint Debug',
              '| Step | Result |',
              '|------|--------|',
              `| deps | ${{ steps.deps.outcome }} |`,
              `| ruff | ${{ steps.ruff.outcome }} |`,
              `| black | ${{ steps.black.outcome }} |`,
            ].join('\n');
            const prNumber = context.payload.pull_request?.number;
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
      - name: Fail on error
        if: steps.deps.outcome == 'failure' || steps.ruff.outcome == 'failure' || steps.black.outcome == 'failure'
        run: exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests (unit only, integration tests excluded)
        run: python -m pytest -q

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: >
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    env:
      HAS_LLM_KEY: ${{ secrets.OPENAI_API_KEY != '' || secrets.AZURE_OPENAI_API_KEY != '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        if: env.HAS_LLM_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        if: env.HAS_LLM_KEY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Stage 1: Factory deploy — generates all artifacts needed by skipped tests
      - name: Factory deploy (generate agents + compile policies)
        if: env.HAS_LLM_KEY == 'true'
        run: python scripts/ci_deploy.py

      # Stage 2: Run ALL tests (unit + deploy-dependent, no skips)
      - name: Full test suite (with generated artifacts)
        if: env.HAS_LLM_KEY == 'true'
        run: python -m pytest -q --tb=short

      # Stage 3: Integration tests (LLM-dependent)
      - name: Integration tests (requires LLM credentials)
        if: env.HAS_LLM_KEY == 'true'
        run: python -m pytest -m integration -o "addopts=" -q

      - name: Skip notice
        if: env.HAS_LLM_KEY != 'true'
        run: echo "⚠️ Integration tests skipped — no LLM credentials configured. Add OPENAI_API_KEY (or Azure equivalents) to repository secrets."
