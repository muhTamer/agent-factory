version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - APP_VERSION=0.0.1
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  concierge:
    build:
      context: .
      dockerfile: concierge.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/concierge/runtime/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://backend:8080
        NEXT_PUBLIC_CONCIERGE_API: http://concierge:8001
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8080
      - NEXT_PUBLIC_CONCIERGE_API=http://concierge:8001
    depends_on:
      backend:
        condition: service_healthy
