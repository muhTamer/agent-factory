# ============================================================
# Account Management & KYC Policy
# Organization: NovaPay Digital Banking
# Version: 1.0
# Last Updated: 2025-03-01
# Owner: Head of Account Operations
# Domain: fintech
# ============================================================

metadata:
  policy_id: novapay_accounts_policy
  jurisdiction: EU
  regulatory_framework:
    - PSD2
    - AMLD5
    - GDPR
    - eIDAS
  internal_references:
    - KYC/AML Compliance Handbook 2024
    - Customer Onboarding Playbook v3.1

overview: >
  This policy defines the rules for account opening, KYC verification,
  account modifications, branch transfers, and account closure across
  all NovaPay consumer and SME accounts. It ensures regulatory compliance
  while maintaining a streamlined customer experience.

scope:
  account_types:
    - individual_current
    - sole_proprietorship
    - partnership
    - limited_liability_partnership
    - private_limited_company
    - public_limited_company
    - nri_account
    - eefc_account
  channels:
    - branch
    - online_portal
    - mobile_app
    - assisted_phone

# ── Section 1: Account Opening ──────────────────────────────

account_opening:
  eligibility:
    - condition: individual_age_minimum
      rule: "Customer must be at least 18 years of age"
      outcome: eligible
    - condition: minor_account
      rule: "Minors (under 18) may open accounts only with a guardian co-applicant"
      outcome: conditional
    - condition: kyc_documents_required
      rule: "Valid government-issued photo ID and proof of address are mandatory for all account types"
      outcome: required
    - condition: nri_proprietorship
      rule: "NRI/PIO may open proprietorship accounts subject to declaration that funds are from inward remittance or NRE/FCNR/NRO accounts"
      outcome: conditional
    - condition: sez_eefc_restriction
      rule: "Special Economic Zone (SEZ) units cannot open EEFC accounts"
      outcome: ineligible

  required_documents:
    individual:
      - government_issued_photo_id
      - proof_of_address
    sole_proprietorship:
      - proof_of_existence_in_firm_name
      - proof_of_address_in_firm_name
      - kyc_of_proprietor
      - two_existence_proofs_from_approved_list
    partnership:
      - partnership_deed
      - pan_card_of_firm
      - kyc_of_all_partners
      - authority_letter
    limited_liability_partnership:
      - incorporation_document
      - llp_agreement
      - certificate_of_incorporation
      - list_of_designated_partners_with_dpin
      - resolution_for_bank_relationship
      - kyc_of_designated_partners
    company:
      - memorandum_of_association
      - articles_of_association
      - certificate_of_incorporation
      - latest_director_list
      - board_resolution
      - kyc_of_directors_and_signatories

  processing:
    standard_timeline: "2-5 business days after complete documentation"
    express_timeline: "Same day for individual accounts with digital KYC"
    account_number_assignment: "Immediate upon approval"

# ── Section 2: KYC Verification ─────────────────────────────

kyc_verification:
  requirements:
    - rule: "All customers must complete KYC before account activation"
    - rule: "Re-KYC required every 2 years for high-risk customers, every 10 years for low-risk"
    - rule: "Enhanced due diligence (EDD) required for politically exposed persons (PEPs)"
    - rule: "Video KYC accepted for remote onboarding (eIDAS Level 2 equivalent)"

  verification_methods:
    - in_branch_verification
    - video_kyc
    - digital_id_verification
    - third_party_verification_service

  failure_handling:
    - condition: kyc_incomplete
      action: "Account remains in pending status; customer notified within 24 hours"
    - condition: kyc_failed
      action: "Account opening denied; customer may re-apply with corrected documents"
    - condition: kyc_expired
      action: "Account restricted to view-only until re-KYC completed"

# ── Section 3: Account Modifications ────────────────────────

account_modifications:
  address_change:
    required_documents:
      - signed_request_letter
      - new_proof_of_address
    processing_time: "1-3 business days"

  signatory_change:
    required_documents:
      - board_resolution_or_partner_consent
      - kyc_of_new_signatory
    processing_time: "3-5 business days"

  branch_transfer:
    eligibility: "All current accounts eligible for branch transfer"
    restrictions: "Certain product-specific restrictions may apply"
    processing_time: "5-7 business days"
    required: "Visit nearest branch to initiate"

  account_upgrade_downgrade:
    eligibility: "Subject to product availability and customer eligibility"
    processing_time: "2-3 business days"

# ── Section 4: Account Closure ──────────────────────────────

account_closure:
  eligibility:
    - rule: "Customer may request closure at any time"
    - rule: "Outstanding liabilities must be settled before closure"
    - rule: "Minimum balance requirement waived during closure month"
  process:
    - step: "Submit closure request at branch or via secure online channel"
    - step: "Clear all pending transactions and dues"
    - step: "Receive final balance via cheque or transfer"
  timeline: "7-10 business days after all dues cleared"

# ── Section 5: Privacy & Data Protection ────────────────────

privacy:
  data_handling:
    - "All account data processed under GDPR Article 6(1)(b) — contractual necessity"
    - "Customer data retained for 5 years post account closure per regulatory requirement"
    - "PII must be masked in all customer-facing communications except name and last 4 digits of account number"
  consent:
    - "Explicit consent required for marketing communications"
    - "Data portability requests fulfilled within 30 days"

# ── Section 6: Escalation ───────────────────────────────────

escalation:
  conditions:
    - "Account opening delayed beyond SLA (5 business days)"
    - "KYC verification dispute"
    - "Unauthorized account modification reported"
    - "Regulatory or compliance concern raised"
  routing:
    low: "Branch manager"
    medium: "Regional account operations team"
    high: "Head of Account Operations + Compliance"
